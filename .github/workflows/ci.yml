name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: uv sync

      - name: Run Ruff Linting Check
        run: uv run ruff check .

      - name: Run Ruff Formatting Check
        run: uv run ruff format --check .

      - name: Run Pytest Unit Test Suite
        run: uv run pytest

      - name: Verify C Engine Compilation (CPU)
        run: |
          make -C c run
          make -C c runq
          make -C c run_bitnet
          make -C c train

      - name: Verify Apple Silicon Metal Engine Compilation (macOS)
        if: runner.os == 'macOS'
        run: |
          make -C c run_metal
          make -C c run_metal_bitnet
          make -C c train_metal
