name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Lint & Test (Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Lightweight CPU Dependencies
        run: |
          uv pip install --system --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install --system numpy tokenizers pytest ruff streamlit
          uv pip install --system -e .

      - name: Check Code Style (Ruff Lint)
        run: ruff check .

      - name: Run Pytest Suite
        run: pytest

      - name: Verify C Engine Compilation
        run: |
          make -C c run
          make -C c runq
          make -C c run_bitnet
          make -C c train
