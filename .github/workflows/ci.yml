name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest torch numpy tokenizers streamlit
          pip install -e .

      - name: Check Code Style (Ruff Lint)
        run: ruff check .

      - name: Run Pytest Suite
        run: pytest

      - name: Verify C Engine Compilation
        run: |
          make -C c run
          make -C c runq
          make -C c run_bitnet
          make -C c train
